
services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cloudops
      POSTGRES_USER: cloudops_user
      POSTGRES_PASSWORD: cloudops_dev_password

    ports:
      - "5432:5432"

    volumes:
      - cloudops_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops_user -d cloudops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cloudops_postgres_data:
